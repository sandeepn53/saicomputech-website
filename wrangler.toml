name = "saicomputech-website"
compatibility_date = "2026-07-28"

[build]
command = "npm run build"
cwd = "."
watch_dir = "src"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Cloudflare Worker Routes for Contact Form API
[[routes]]
pattern = "saicomputech.com/api/contact"
zone_name = "saicomputech.com"

# Environment variables for production
[env.production]
vars = { ENVIRONMENT = "production" }

# Note: RESEND_API_KEY should be set as a Cloudflare secret using:
# wrangler secret put RESEND_API_KEY
