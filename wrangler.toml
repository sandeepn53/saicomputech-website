name = "saicomputech-website"
compatibility_date = "2026-07-28"

[build]
command = "npm run build"
cwd = "."
watch_dir = "src"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[env.production]
route = "example.com/api/contact"
zone_id = "your_zone_id"

[env.production.vars]
RESEND_API_KEY = "" # Set this in Cloudflare dashboard secrets
